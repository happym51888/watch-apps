name: Volumen

options:
  bundleIdPrefix: app.volumen
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID here, or pick a team in Xcode's Signing pane.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Note there is no `packages:` block. Sources/VolumenCore is compiled straight
# into each target instead of being consumed as a local SwiftPM package, which
# is why the app-layer files do not `import VolumenCore` — inside the Xcode
# build it is all one module. Package.swift still builds the core as a real
# module and is what `swift test` uses, so the tests are unaffected either way.

targets:

  # A paired app rather than watch-only. The watch cannot open the Files app,
  # and an audiobook player that cannot be given an audiobook is a demo. The
  # phone side exists to hand files across and does nothing else.
  Volumen:
    type: application
    platform: iOS
    sources:
      - path: PhoneApp
      - path: Sources/VolumenCore
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.volumen
        INFOPLIST_FILE: PhoneApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: VolumenWatch
        embed: true

  VolumenWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Sources/VolumenCore
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.volumen.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# No unit-test target on purpose. `Tests/VolumenCoreTests` uses
# `@testable import VolumenCore`, which needs VolumenCore to be a real module —
# it is, under Package.swift, and `swift test` runs it there. An Xcode test
# target that compiled the core sources in directly would break that import for
# no benefit, since the same tests already run in CI.

schemes:
  Volumen:
    build:
      targets:
        Volumen: all
        VolumenWatch: all
  VolumenWatch:
    build:
      targets:
        VolumenWatch: all
