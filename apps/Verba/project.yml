name: Verba

options:
  bundleIdPrefix: app.verba
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Team ID here, or pick a team in Xcode's Signing pane.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Note there is no `packages:` block. Sources/VerbaCore is compiled straight
# into each target instead of being consumed as a local SwiftPM package, which
# is why the app-layer files do not `import VerbaCore` — inside the Xcode build
# it is all one module. Package.swift still builds the core as a real module
# and is what `swift test` uses, so the tests are unaffected either way.

targets:

  # The iPhone app is a real app here, not a stub container: it does the
  # transcription, because watchOS has no speech API at all. That also means
  # this ships as a normal paired app and avoids the watch-only submission
  # dance the other apps in this repo need.
  Verba:
    type: application
    platform: iOS
    sources:
      - path: PhoneApp
      - path: Sources/VerbaCore
      # The iPhone app is a real, launchable app, so it needs its own icon and
      # its own privacy manifest. Neither was wired up here.
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verba
        INFOPLIST_FILE: PhoneApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: VerbaWatch
        embed: true

  VerbaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Sources/VerbaCore
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.verba.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# No unit-test target on purpose. `Tests/VerbaCoreTests` uses
# `@testable import VerbaCore`, which needs VerbaCore to be a real module — it
# is, under Package.swift, and `swift test` runs it there. An Xcode test target
# that compiled the core sources in directly would break that import for no
# benefit, since the same tests already run in CI.

schemes:
  Verba:
    build:
      targets:
        Verba: all
        VerbaWatch: all
  VerbaWatch:
    build:
      targets:
        VerbaWatch: all
