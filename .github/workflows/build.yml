name: Build

# You have no Mac, so this is the Mac.
#
# GitHub's macOS runners come with Xcode preinstalled and are free for public
# repositories (private repos bill macOS minutes at 10x, so a private repo will
# consume a free-tier allowance quickly — budget for that or keep the repo
# public).
#
# What this gives you:
#   * a real compiler verdict on Swift that has never been compiled
#   * the SwiftPM logic tests, run for real
#   * the Python validators, run alongside them
#   * an unsigned archive you can inspect
#
# What it does not give you: haptic feel, extended-runtime reliability, battery
# cost, or Core Location behaviour. Those need a wrist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Fast gate. Runs first because it needs no Xcode and catches the algorithmic
  # regressions that matter most.
  # -------------------------------------------------------------------------
  validate-logic:
    name: Logic validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The validators are stdlib-only on purpose. The repo checks below read
      # project.yml, so they need a YAML parser; install it once, up front,
      # rather than in whichever step happens to run first.
      - name: Install check dependencies
        run: pip install --quiet pyyaml

      - name: Prayer astronomy vs published timetables
        run: python apps/Awqat/validation/verify_astronomy.py

      - name: Metronome haptic rate limit
        run: python apps/Tactus/validation/verify_haptic_plan.py

      - name: TOTP vs RFC 4226 / 6238 / 4648
        run: python apps/Kairos/validation/verify_totp.py

      - name: Recorder delivery queue never loses audio
        run: python apps/Verba/validation/verify_queue.py

      - name: Transcript chunking and stitching
        run: python apps/Verba/validation/verify_transcript.py

      - name: Memo upsert never blanks a populated field
        run: python apps/Verba/validation/verify_upsert.py

      - name: Privacy manifests match what the code calls
        run: python tools/check_privacy_manifests.py

      # Three of four watch apps built cleanly with no CFBundleIdentifier and
      # could not be installed. The simulator job catches that for watch apps;
      # nothing installs the iPhone apps or the complications, so check them
      # statically too.
      - name: Bundles declare the keys they need to install
        run: python tools/check_infoplists.py

      # The repo is public, which is what makes the macOS runners free, and
      # also means every commit is fetchable forever. Verba's setup asks the
      # reader to paste a Supabase URL and key into files that are gitignored
      # — but a gitignore only guards paths someone remembered to list.
      - name: No credentials in tracked files
        run: |
          python tools/test_check_secrets.py
          python tools/check_secrets.py

      # A PowerShell `Set-Content` bundle-id rename rewrote Tactus/project.yml
      # in the ANSI code page, truncating three em-dashes in comments. Nothing
      # local objected; XcodeGen on the runner refused to parse the file.
      - name: Source files are UTF-8
        run: |
          python tools/test_check_encoding.py
          python tools/check_encoding.py

      # Guards against continue-on-error coming back. See the script's header:
      # it is why run 5 reported 11/11 green with two builds failing.
      - name: CI can still fail
        run: python tools/check_workflow.py

  # -------------------------------------------------------------------------
  # The database half of Verba, against a real PostgreSQL server.
  #
  # verify_upsert.py above models the upsert in SQLite, which checks the
  # coalesce logic but nothing about Postgres. The riskiest code in the schema
  # is Postgres-specific and fails silently: a wrong Row Level Security policy
  # does not raise, it returns other people's recordings. Same shape of problem
  # as the haptic rate limit or the Asr calculation — wrong answers, no error.
  #
  # This applies the unmodified schema.sql on top of a shim providing what
  # Supabase would (auth.uid(), storage.foldername(), the client roles) and
  # then impersonates real users to check the policies actually bite.
  # -------------------------------------------------------------------------
  postgres-schema:
    name: Verba schema on real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version Supabase runs. The official image carries the
        # contrib modules, so pg_trgm and pgcrypto are available.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver
        run: pip install --quiet "psycopg[binary]"

      - name: Verify schema, RLS, upsert and search
        run: |
          python apps/Verba/supabase/test/verify_schema.py \
            --dsn "postgresql://postgres:postgres@127.0.0.1:5432/postgres"

  # -------------------------------------------------------------------------
  # The compile verdict. `continue-on-error` was set during bring-up, when this
  # Swift had never seen a compiler and the useful output was the full list of
  # errors rather than a job stopping at the first one. It is now removed: with
  # it in place a suite could report a green job while tests were failing, which
  # is exactly what happened to Awqat's two Julian Day assertions.
  # -------------------------------------------------------------------------
  swift-tests:
    name: swift test (${{ matrix.app }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [Tactus, Awqat, Kairos, Verba]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: swift test
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tee swift-test-${{ matrix.app }}.log

      # Same treatment as the xcodebuild job. Reading these through
      # `gh run view --log` is unreliable on some networks; an artifact always
      # downloads.
      - name: Collect failures
        if: always()
        working-directory: apps/${{ matrix.app }}
        run: |
          echo "### swift test — ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|XCTAssert.*failed|Test Case.*failed|Executed [0-9]+ test" \
            swift-test-${{ matrix.app }}.log \
            | sort -u | head -60 >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-test-${{ matrix.app }}
          path: apps/${{ matrix.app }}/swift-test-${{ matrix.app }}.log

  # -------------------------------------------------------------------------
  # Full watchOS build via XcodeGen. Unsigned, because there is no certificate
  # in CI; this proves the app targets compile and link, not that they ship.
  # -------------------------------------------------------------------------
  watch-build:
    name: xcodebuild (${{ matrix.scheme }})
    runs-on: macos-15
    needs: validate-logic
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Tactus
            scheme: TactusWatch
          - app: Awqat
            scheme: AwqatWatch
          - app: Kairos
            scheme: KairosWatch
          - app: Verba
            scheme: VerbaWatch
          # The iPhone targets need building too. The first run only built the
          # watch schemes, which meant Verba's whole transcription and Supabase
          # layer — and Kairos's phone enrolment screen — were never compiled,
          # and a Swift 6 Sendable error sat there looking like a pass.
          - app: Kairos
            scheme: Kairos
            destination: generic/platform=iOS
          - app: Verba
            scheme: Verba
            destination: generic/platform=iOS
    steps:
      - uses: actions/checkout@v4

      # Verba's iPhone target reads Supabase.plist at runtime and is gitignored.
      # The build needs the file to exist; the values are irrelevant to whether
      # it compiles.
      - name: Stub Supabase config
        if: matrix.app == 'Verba'
        run: cp apps/Verba/PhoneApp/Supabase.example.plist apps/Verba/PhoneApp/Supabase.plist

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/${{ matrix.app }}
        run: xcodegen generate

      # No `continue-on-error` here. During bring-up it was set so one run would
      # surface every app's errors instead of stopping at the first failure, but
      # it also made the job report success while xcodebuild was failing — a
      # green tick that meant nothing. The matrix already gives per-scheme
      # isolation, and the steps below are `if: always()`, so errors and logs
      # still come back from a failed build.
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project ${{ matrix.app }}.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination || 'generic/platform=watchOS' }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            | tee build-${{ matrix.scheme }}.log

      - name: Collect errors
        if: always()
        run: |
          echo "### ${{ matrix.scheme }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|warning:" apps/${{ matrix.app }}/build-${{ matrix.scheme }}.log \
            | sort -u | head -80 >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.scheme }}
          path: apps/${{ matrix.app }}/build-${{ matrix.scheme }}.log

  # -------------------------------------------------------------------------
  # Does it actually run?
  #
  # Everything above proves the code compiles. None of it proves the app
  # launches: any of these could crash in `App.init` or draw a blank screen
  # and every job would still be green. This installs each watch app on a
  # watchOS simulator, launches it, checks for a crash report, and inspects
  # the screenshot to confirm something was drawn.
  #
  # The screenshots are uploaded because App Store Connect needs watch
  # screenshots and there is no Mac here to take them by hand.
  # -------------------------------------------------------------------------
  simulator-smoke:
    name: launches on simulator (${{ matrix.scheme }})
    runs-on: macos-15
    needs: watch-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Kairos
            scheme: KairosWatch
          - app: Tactus
            scheme: TactusWatch
          - app: Awqat
            scheme: AwqatWatch
          - app: Verba
            scheme: VerbaWatch
    steps:
      - uses: actions/checkout@v4

      - name: Stub Supabase config
        if: matrix.app == 'Verba'
        run: cp apps/Verba/PhoneApp/Supabase.example.plist apps/Verba/PhoneApp/Supabase.plist

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show available watchOS runtimes
        run: xcrun simctl list runtimes

      - name: Launch and capture
        run: bash tools/simulator_smoke.sh apps/${{ matrix.app }} ${{ matrix.scheme }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.scheme }}
          path: screenshots/
